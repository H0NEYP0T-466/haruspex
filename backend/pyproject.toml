[project]
name = "haruspex"
version = "0.1.0"
description = "Explainable AI framework for zero-day malware detection and digital forensic investigation"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "SIM"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
