name: "Bug report"
description: "Report a reproducible problem"
labels: ["bug"]
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below.

  - type: textarea
    id: summary
    attributes:
      label: "Summary"
      description: "A clear and concise description of what the bug is."
      placeholder: "Describe the bug..."
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: "Steps to Reproduce"
      description: "Detailed steps to reproduce the behavior."
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Upload file '...'
        4. See error
      render: shell
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "I expected..."
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: "Actual Behavior"
      description: "What actually happened?"
      placeholder: "Instead, I got..."
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of HARUSPEX is affected?"
      options:
        - Backend API
        - Model Training
        - Model Prediction
        - XAI (SHAP/LIME)
        - Forensics (LIEF/YARA)
        - Correlation Engine
        - Frontend UI
        - Deep Learning (MLP/TabNet)
        - Other
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating System"
      placeholder: "e.g., Ubuntu 22.04, macOS 14.2, Windows 11"
    validations:
      required: true

  - type: input
    id: python-version
    attributes:
      label: "Python Version"
      placeholder: "e.g., 3.11.7"
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: "Node.js Version"
      placeholder: "e.g., 20.10.0"
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: "Logs / Error Output"
      description: "Paste any relevant log output or error messages."
      render: shell
      placeholder: |
        Traceback (most recent call last):
          ...
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: "Screenshots"
      description: "If applicable, add screenshots to help explain the problem."
      placeholder: "Drag and drop images here..."
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: "Severity"
      description: "How severe is this bug?"
      options:
        - Critical — System crash, data loss, security issue
        - High — Major feature broken, no workaround
        - Medium — Feature partially broken, workaround exists
        - Low — Minor issue, cosmetic, doesn't affect functionality
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: "Additional Context"
      description: "Any other context about the problem."
      placeholder: "Add any other context, configurations, or related issues..."
    validations:
      required: false
